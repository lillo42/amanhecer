name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Amanhecer.slnx

      - name: "Test InMemory (TUnit timeout: 5 minutes)"
        run: dotnet test tests/Amanhecer.InMemory.Tests/Amanhecer.InMemory.Tests.csproj --configuration Release

      - name: Test Abstractions
        run: dotnet test tests/Amanhecer.Abstractions.Tests/Amanhecer.Abstractions.Tests.csproj --configuration Release

      - name: Test core Amanhecer
        run: dotnet test tests/Amanhecer.Tests/Amanhecer.Tests.csproj --configuration Release

      - name: Test Extensions.Hosting
        run: dotnet test tests/Amanhecer.Extensions.Hosting.Tests/Amanhecer.Extensions.Hosting.Tests.csproj --configuration Release

      - name: Test Extensions.Resilience
        run: dotnet test tests/Amanhecer.Extensions.Resilience.Tests/Amanhecer.Extensions.Resilience.Tests.csproj --configuration Release

      - name: Test OpenTelemetry
        run: dotnet test tests/Amanhecer.OpenTelemetry.Tests/Amanhecer.OpenTelemetry.Tests.csproj --configuration Release

      - name: Test Polly
        run: dotnet test tests/Amanhecer.Polly.Tests/Amanhecer.Polly.Tests.csproj --configuration Release

      - name: Test RabbitMQ Streams (broker-independent unit tests)
        run: dotnet test tests/Amanhecer.RabbitMq.Streams.Tests/Amanhecer.RabbitMq.Streams.Tests.csproj --configuration Release

      - name: Test IntegrationTests
        run: dotnet test tests/Amanhecer.IntegrationTests/Amanhecer.IntegrationTests.csproj --configuration Release

      - name: Collect TUnit HTML report
        if: always()
        run: |
          mkdir -p test-report
          find "$RUNNER_TEMP/tunit-aggregate" -name 'merged-report.html' -exec cp {} test-report/ \;

      - name: Upload TUnit HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-html-report
          path: test-report/merged-report.html
          if-no-files-found: ignore

  rabbitmq:
    needs: build
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
          - 5552:5552
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Amanhecer.slnx

      - name: Enable RabbitMQ Stream plugin
        run: |
          docker exec $(docker ps -q --filter "publish=5672") \
            rabbitmq-plugins enable rabbitmq_stream rabbitmq_stream_management
          # Wait for the stream port to accept connections
          for i in $(seq 1 30); do
            if nc -z localhost 5552 2>/dev/null; then
              echo "Stream port ready after ${i} attempts"
              break
            fi
            sleep 2
          done
          nc -z localhost 5552 || { echo "Stream port 5552 never became available"; exit 1; }

      - name: "Test RabbitMQ (requires the broker service; TUnit timeout: 10 minutes)"
        run: dotnet test tests/Amanhecer.RabbitMq.Tests/Amanhecer.RabbitMq.Tests.csproj --configuration Release

  kafka:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Amanhecer.slnx

      - name: Start Apache Kafka 4 (required by the Dekaf tests, which need KIP-848)
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:4.0.0
          # Topics are provisioned explicitly by the transports; auto-creation is disabled
          # so missing-topic validation is meaningful.

      - name: Wait for the broker
        run: |
          for i in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null

      - name: "Test Kafka (requires the broker container; TUnit timeout: 10 minutes)"
        run: |
          set -e
          dotnet test tests/Amanhecer.ConfluentKafka.Tests/Amanhecer.ConfluentKafka.Tests.csproj --configuration Release
          dotnet test tests/Amanhecer.Dekaf.Tests/Amanhecer.Dekaf.Tests.csproj --configuration Release

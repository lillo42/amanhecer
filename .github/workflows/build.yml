name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Amanhecer.slnx

      - name: Build and test (no external dependencies)
        run: |
          set -e
          for project in tests/*/*.csproj; do
            case "$project" in
              # Shared contract-test library (not runnable) and the RabbitMQ
              # tests, which need the broker and run in their own job.
              *Messaging.Base.Tests*|*RabbitMq.Tests*) continue ;;
            esac
            dotnet test "$project" --configuration Release
          done

  rabbitmq:
    needs: build
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Amanhecer.slnx

      - name: Test RabbitMQ (requires the broker service)
        run: dotnet test tests/Amanhecer.RabbitMq.Tests/Amanhecer.RabbitMq.Tests.csproj --configuration Release

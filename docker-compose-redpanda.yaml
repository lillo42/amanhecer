services:
  redpanda:
    # Fully-qualified image name so podman does not prompt for a registry.
    image: redpandadata/redpanda:v26.2.2
    hostname: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      # Kafka API
      - "9092:9092"
      # Admin API
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redpanda-init:
    # Topics are provisioned explicitly by the transports; disable auto-creation (a cluster
    # config) once the broker is up, so missing-topic validation is meaningful.
    image: redpandadata/redpanda:v26.2.2
    pull_policy: if_not_present
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["rpk", "-X", "brokers=redpanda:9092", "-X", "admin.hosts=redpanda:9644", "cluster", "config", "set", "auto_create_topics_enabled", "false"]
    restart: "no"
